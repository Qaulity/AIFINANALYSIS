version: "3.8"

services:
  # Redis - Data storage and caching
  redis:
    image: redis:7-alpine
    container_name: fna-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fna-network

  # Flask API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fna-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - DEBUG=false
    env_file:
      - ./backend/.env.prod
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fna-network

  # News Pipeline Worker
  pipeline:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fna-pipeline
    restart: always
    command: python -m app.worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    env_file:
      - ./backend/.env.prod
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fna-network

  # React Frontend (nginx served)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: fna-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - fna-network

volumes:
  redis_data:

networks:
  fna-network:
    driver: bridge
